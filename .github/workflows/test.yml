name: Test and publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - "**"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
        if: ${{ github.base_ref }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 20
          check-latest: false
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: "Upload Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: |
            packages/*/dist/
            packages/@apphosting/*/dist/
            packages/@apphosting/experimental/*/dist/
            packages/@google-cloud/*/dist/
          # The publish job reuses this artifact after a human approves the release environment.
          retention-days: 7
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node: [18, 22]
      fail-fast: false
    name: Test Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
        if: ${{ github.base_ref }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Install deps
        run: npm ci
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      - name: Rsync Artifacts
        run: rsync -a artifact/ packages
      - name: Test
        run: npm run test
        continue-on-error: ${{ matrix.node == 22 }}

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Install deps
        run: npm ci
      - name: Test
        run: npm run lint:quiet

  # Break the branch protection test into a separate step, so we can manage the matrix more easily
  test_and_contribute:
    runs-on: ubuntu-latest
    name: Branch protection
    needs: ["test", "lint"]
    steps:
      - run: true

  publish:
    environment: release
    runs-on: ubuntu-latest
    name: Publish (NPM)
    needs: ["build", "test"]
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 20
          check-latest: false
          registry-url: "https://registry.npmjs.org"
      # scripts/publish.js runs lerna. ubuntu-26.04 runners no longer ship a global lerna, so install
      # the repo's own copy, before the build artifacts are copied in.
      - name: Install deps
        run: npm ci
      - name: "Download Artifacts"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      - name: Rsync Artifacts
        run: rsync -a artifact/ packages
      - name: Publish
        if: ${{ vars.NPM_PUBLISH_VIA != 'exit-gate' }}
        run: npm run publish
        env:
          ADAPTER_NEXTJS_NPM_TOKEN: ${{ secrets.ADAPTER_NEXTJS_NPM_TOKEN }}
          ADAPTER_ANGULAR_NPM_TOKEN: ${{ secrets.ADAPTER_ANGULAR_NPM_TOKEN }}
          ADAPTER_COMMON_NPM_TOKEN: ${{ secrets.ADAPTER_COMMON_NPM_TOKEN }}
          ADAPTER_ASTRO_NPM_TOKEN: ${{ secrets.ADAPTER_ASTRO_NPM_TOKEN }}
          # FIREBASE_FRAMEWORKS_NPM_TOKEN: ${{ secrets.FIREBASE_FRAMEWORKS_NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.PERSONAL_NPM_TOKEN }}
      - name: Authenticate with OSS Exit Gate GCP Project (WIF)
        if: ${{ vars.NPM_PUBLISH_VIA == 'exit-gate' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"
      - name: Setup gcloud tool
        if: ${{ vars.NPM_PUBLISH_VIA == 'exit-gate' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Publish via OSS Exit Gate
        if: ${{ vars.NPM_PUBLISH_VIA == 'exit-gate' }}
        run: |
          node ./scripts/publish.js --setup-npmrc
          # .npmrc now points the default registry at Artifact Registry, so fetch the auth helper from npm.
          npx --yes --registry=https://registry.npmjs.org/ google-artifactregistry-auth@3.5.0 \
            --repo-config=.npmrc --credential-config=.npmrc
          npm run publish -- --use-oss-gate
          MANIFEST_NAME="manifest-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}.json"
          cp manifest.json "${MANIFEST_NAME}"
          echo "MANIFEST_NAME=${MANIFEST_NAME}" >> "${GITHUB_ENV}"
          if jq -e '.publishing_groups | length > 0' "${MANIFEST_NAME}" >/dev/null; then
            gcloud storage cp "${MANIFEST_NAME}" \
              "gs://oss-exit-gate-prod-projects-bucket/firebase-framework-tools/npm/manifests/${MANIFEST_NAME}"
          else
            echo "No packages staged in this run; skipping GCS manifest upload."
          fi
      - name: Upload timestamped manifest artifact
        if: ${{ vars.NPM_PUBLISH_VIA == 'exit-gate' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.MANIFEST_NAME }}
          path: ${{ env.MANIFEST_NAME }}
          retention-days: 30
          if-no-files-found: error
